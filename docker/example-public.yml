services:
  example:
    image: ghcr.io/example:latest
    container_name: setup
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.example.rule=Host(`example.aylabs.fr`)"
      - "traefik.http.routers.example.entrypoints=websecure"
      - "traefik.http.routers.example.tls.certresolver=letsencrypt"
      - "traefik.http.services.example.loadbalancer.server.port=80"
      - "traefik.http.routers.example-http.rule=Host(`example.aylabs.fr`)"
      - "traefik.http.routers.example-http.entrypoints=web"
      - "traefik.http.middlewares.example-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.example-http.middlewares=setup-redirect"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik_traefik
