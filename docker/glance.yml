services:
  glance:
    container_name: glance
    image: glanceapp/glance
    networks:
      wg:
        ipv4_address: 10.42.42.4
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  wg:
    external: true
    name: wireguard_wg
